; STM32F407 Pomodoro — app slot @ 0x08010000 (64 KiB bootloader ahead of this image)
; Build/flash with PlatformIO; source layout stays the same as the CubeIDE project.

[platformio]
src_dir = Core

[env:black_f407vg]
platform = ststm32
board = black_f407vg
extra_scripts = pre:extra_pio.py
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
board_build.ldscript = STM32F407VGTX_APP.ld
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 983040

lib_extra_dirs = .
lib_ldf_mode = chain
lib_deps =
    lvgl
    bsp

; CubeIDE layout: application under Core/Src, startup asm next to it
build_src_filter =
    +<Src/*.c>
    +<Src/pomodoro/**/*.c>
    +<Startup/*.s>

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D VECT_TAB_OFFSET=0x00010000U
    -D ARM
    -D USE_STM32F407xx_HAL_TICK
    ; Match CubeIDE: 240x320 panel layout (arc size, fonts, buttons, icon zoom in main_screen.c)
    -D SCREEN_SIZE_240x320
    -I Core/Inc
    -I Core/Src/pomodoro/Core
    -I Core/Src/pomodoro/UI
    -I bsp
    -I bsp/lcd
    -I bsp/lcd/tsc
    -I bsp/lvgl
    -I .

monitor_speed = 115200
