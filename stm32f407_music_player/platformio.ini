; STM32F407 Discovery music player — app slot @ 0x08010000 (64 KiB bootloader)

[env:black_f407vg]
platform = ststm32
board = black_f407vg
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
board_build.ldscript = STM32F407VGTX_APP.ld
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 983040
extra_scripts = pre:extra_pio.py, post:scripts/post_build_sd_apps.py

lib_extra_dirs = ../lib
lib_ldf_mode = chain
lib_deps =
    lvgl/lvgl @ 9.2.2
    stm32f407_hat_bsp
    sdcard
    audio
    fatfs
    helix-mp3

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D VECT_TAB_OFFSET=0x00010000U
    -D ARM
    -D BSP_HAS_SD_SPI_BUS=1
    -D BSP_XPT2046_I2S_GATING=1
    -D BSP_LCD_DRAW_BUF_KB=12
    -I ../lib/stm32f407_hat_bsp
    -I ../lib/stm32f407_hat_bsp/lcd
    -I ../lib/stm32f407_hat_bsp/port
    -I ../lib/stm32f407_hat_bsp/touch
    -I ../lib/stm32f407_hat_bsp/board
    -I include
    -I lib/sdcard
    -I lib/fatfs
    -I lib/helix/pub
    -I lib/audio

monitor_speed = 115200
