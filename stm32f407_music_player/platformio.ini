; STM32F407 Discovery music player — app slot @ 0x08010000 (64 KiB bootloader)

[env:black_f407vg]
platform = ststm32
board = black_f407vg
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
board_build.ldscript = STM32F407VGTX_APP.ld
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 983040
extra_scripts = pre:extra_pio.py, post:scripts/post_build_sd_apps.py

lib_ldf_mode = chain
lib_deps =
    lvgl/lvgl @ 9.2.2
    audio
    bsp
    fatfs
    helix-mp3

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D USER_VECT_TAB_ADDRESS
    -D VECT_TAB_OFFSET=0x00010000U
    -D ARM
    -I include
    -I lib/bsp
    -I lib/bsp/lcd
    -I lib/bsp/port
    -I lib/bsp/touch
    -I lib/bsp/sdcard
    -I lib/fatfs
    -I lib/helix/pub
    -I lib/audio

monitor_speed = 115200
